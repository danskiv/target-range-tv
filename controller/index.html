<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Target Range — Air Gun Controller</title>
    <link rel="stylesheet" href="/ctrl_static/css/controller.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Pairing / Intro / QR Scanner Screen -->
    <div id="permission-screen">
        <div class="intro-card">
            <h2>🎯 Hubungkan ke TV / Laptop</h2>
            <p>Pindai Barcode di TV atau masukkan kode room:</p>
            
            <!-- Camera Scanner Box -->
            <div id="scanner-container" style="position: relative; width: 100%; height: 180px; background: #000; border-radius: 14px; overflow: hidden; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; border: 2px dashed #38bdf8;">
                <video id="qr-video" style="width: 100%; height: 100%; object-fit: cover; display: none;" playsinline></video>
                <canvas id="qr-canvas" style="display: none;"></canvas>
                <div id="scanner-placeholder" style="text-align: center; color: #94a3b8;">
                    <span style="font-size: 32px;">📷</span>
                    <div style="font-size: 13px; margin-top: 4px;">Kamera Siap</div>
                </div>
            </div>

            <button id="btn-start-scanner" class="btn-primary" style="margin-bottom: 12px; background: #0284c7;">📸 BUKA KAMERA & SCAN QR TV</button>

            <!-- Manual Input Alternative -->
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                <input type="text" id="input-room-code" placeholder="TG88" maxlength="6" 
                       style="flex: 1; text-align: center; font-size: 20px; font-weight: 900; letter-spacing: 2px; padding: 10px; border-radius: 10px; border: 2px solid #3b82f6; background: #0f172a; color: #38bdf8; text-transform: uppercase;">
                <button id="btn-connect-room" class="btn-primary" style="flex: 1; font-size: 14px; padding: 10px;">⚡ GABUNG</button>
            </div>
        </div>
    </div>

    <!-- Main Controller App -->
    <div id="controller-app" style="display: none;">
        <!-- Top Status Bar -->
        <div class="header-bar">
            <div class="player-badge" id="player-name-tag">Menghubungkan...</div>
            <div class="ammo-indicator">
                <div class="bullet-dot"></div>
                <div class="bullet-dot"></div>
                <div class="bullet-dot"></div>
                <div class="bullet-dot"></div>
                <div class="bullet-dot"></div>
                <div class="bullet-dot"></div>
            </div>
        </div>

        <!-- Calibration Button -->
        <div class="calibration-bar">
            <button id="btn-recenter" class="btn-recenter">🎯 ARAHKAN KE TENGAH TV & KALIBRASI</button>
        </div>

        <!-- Big Trigger Area -->
        <div id="trigger-area" class="trigger-zone">
            <div class="trigger-text">TEMBAK</div>
            <div class="trigger-subtext">Sentuh Di Sini</div>
        </div>

        <!-- Bottom Controls -->
        <div class="bottom-bar">
            <button id="btn-reload" class="btn-reload">🔄 KOKANG (RELOAD)</button>
            <button id="btn-start-game" class="btn-start">▶️ MULAI GAME</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/ctrl_static/js/jsQR.js"></script>
    <script src="/ctrl_static/js/controller.js"></script>
</body>
</html>
