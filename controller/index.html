<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Target Range — Air Gun Controller</title>
    <link rel="stylesheet" href="/ctrl_static/css/controller.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Permission / Intro / Room Setup Modal -->
    <div id="permission-screen">
        <div class="intro-card">
            <h2>🎯 Target Range TV</h2>
            <p>Masukkan Kode Room di TV atau langsung hubungkan:</p>
            <div style="margin-bottom: 16px;">
                <input type="text" id="input-room-code" placeholder="TG88" maxlength="6" 
                       style="width: 100%; text-align: center; font-size: 24px; font-weight: 900; letter-spacing: 3px; padding: 12px; border-radius: 12px; border: 2px solid #3b82f6; background: #0f172a; color: #38bdf8; text-transform: uppercase;">
            </div>
            <button id="btn-connect-room" class="btn-primary" style="margin-bottom: 10px;">⚡ HUBUNGKAN KE TV</button>
            <button id="btn-grant-permission" style="background: transparent; border: none; color: #94a3b8; font-size: 13px; padding: 8px; width: 100%; cursor: pointer;">Lewati & Mulai Cepat</button>
        </div>
    </div>

    <!-- Main Controller App -->
    <div id="controller-app">
        <!-- Top Status Bar -->
        <div class="header-bar">
            <div class="player-badge" id="player-name-tag">Menghubungkan...</div>
            <div class="ammo-indicator">
                <div class="bullet-dot"></div>
                <div class="bullet-dot"></div>
                <div class="bullet-dot"></div>
                <div class="bullet-dot"></div>
                <div class="bullet-dot"></div>
                <div class="bullet-dot"></div>
            </div>
        </div>

        <!-- Calibration Button -->
        <div class="calibration-bar">
            <button id="btn-recenter" class="btn-recenter">🎯 ARAHKAN KE TENGAH TV & KALIBRASI</button>
        </div>

        <!-- Big Trigger Area -->
        <div id="trigger-area" class="trigger-zone">
            <div class="trigger-text">TEMBAK</div>
            <div class="trigger-subtext">Sentuh Di Sini</div>
        </div>

        <!-- Bottom Controls -->
        <div class="bottom-bar">
            <button id="btn-reload" class="btn-reload">🔄 KOKANG (RELOAD)</button>
            <button id="btn-start-game" class="btn-start">▶️ MULAI GAME</button>
        </div>
    </div>

    <!-- Controller Scripts -->
    <script src="/ctrl_static/js/controller.js"></script>
</body>
</html>
