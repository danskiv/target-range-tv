<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Target Range — Air Gun Controller</title>
    <link rel="stylesheet" href="/ctrl_static/css/controller.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Pairing / Intro / QR Scanner Screen -->
    <div id="permission-screen">
        <div class="intro-card">
            <h2>🎯 Hubungkan ke TV / Laptop</h2>
            <p>Pindai Barcode di TV atau masukkan kode room:</p>
            
            <!-- Quick Action & Manual Code Pairing -->
            <div style="margin-bottom: 12px;">
                <button id="btn-connect-room" class="btn-primary" style="width: 100%; font-size: 16px; padding: 14px; background: linear-gradient(135deg, #0284c7, #2563eb); box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);">
                    ⚡ GABUNG KE TV SEKARANG
                </button>
            </div>

            <!-- Optional Manual Input -->
            <div style="display: flex; gap: 8px; align-items: center; justify-content: center; background: #0f172a; border-radius: 12px; padding: 8px 12px; border: 1px solid #1e293b;">
                <span style="font-size: 12px; color: #94a3b8; font-weight: bold;">Kode Room TV:</span>
                <input type="text" id="input-room-code" placeholder="TG88" maxlength="6" 
                       style="width: 100px; text-align: center; font-size: 18px; font-weight: 900; letter-spacing: 2px; padding: 6px; border-radius: 8px; border: 2px solid #3b82f6; background: #020617; color: #38bdf8; text-transform: uppercase;">
            </div>

            <!-- Optional Camera Scanner (Only for HTTPS/Local) -->
            <div style="margin-top: 14px; border-top: 1px solid #1e293b; pt: 12px;">
                <button id="btn-start-scanner" class="btn-primary" style="background: #1e293b; color: #94a3b8; font-size: 12px; padding: 8px; width: 100%; border: 1px solid #334155;">
                    📷 Pindai QR Barcode TV (Opsional)
                </button>
                <div id="scanner-container" style="display: none; position: relative; width: 100%; height: 160px; background: #000; border-radius: 12px; overflow: hidden; margin-top: 8px; border: 2px dashed #38bdf8;">
                    <video id="qr-video" style="width: 100%; height: 100%; object-fit: cover; display: none;" playsinline></video>
                    <canvas id="qr-canvas" style="display: none;"></canvas>
                    <div id="scanner-placeholder" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #94a3b8;">
                        <span style="font-size: 28px;">📷</span>
                        <div style="font-size: 12px; margin-top: 4px;">Kamera Siap</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Controller App -->
    <div id="controller-app" style="display: none;">
        <!-- Top Status Bar -->
        <div class="header-bar">
            <div class="player-badge" id="player-name-tag">Menghubungkan...</div>
            <div class="ammo-indicator">
                <div class="bullet-dot"></div>
                <div class="bullet-dot"></div>
                <div class="bullet-dot"></div>
                <div class="bullet-dot"></div>
                <div class="bullet-dot"></div>
                <div class="bullet-dot"></div>
            </div>
        </div>

        <!-- Calibration Button -->
        <div class="calibration-bar">
            <button id="btn-recenter" class="btn-recenter">🎯 ARAHKAN KE TENGAH TV & KALIBRASI</button>
        </div>

        <!-- Big Trigger Area -->
        <div id="trigger-area" class="trigger-zone">
            <div class="trigger-text">TEMBAK</div>
            <div class="trigger-subtext">Sentuh Di Sini</div>
        </div>

        <!-- Bottom Controls -->
        <div class="bottom-bar">
            <button id="btn-reload" class="btn-reload">🔄 KOKANG (RELOAD)</button>
            <button id="btn-start-game" class="btn-start">▶️ MULAI GAME</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/ctrl_static/js/jsQR.js"></script>
    <script src="/ctrl_static/js/controller.js"></script>
</body>
</html>
